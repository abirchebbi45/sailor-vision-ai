# config.yaml combiné

# Chemins des ensembles de données pour YOLO
train: data/images/train  # Chemin vers les images d'entraînement.
val: data/images/val      # Chemin vers les images de validation.
test: data/images/test    # Chemin vers les images de test.

# Chemins vers les labels YOLO
train_labels: data/yolo/train  # Chemin vers les labels d'entraînement.
val_labels: data/yolo/val      # Chemin vers les labels de validation.
test_labels: data/yolo/test    # Chemin vers les labels de test.

# Nombre total de classes (4)
nc: 4

# Noms des classes (dans l'ordre des IDs)
names: ['swimmer', 'swimmer with life jacket', 'boat', 'life jacket']

# Chemins des dossiers
paths:
  images_dir: "data/images"                    # Dossier des images.
  annotations_dir: "data/annotations"          # Dossier des annotations.
  train_images_dir: "data/images/train"        # Dossier des images d'entraînement.
  val_images_dir: "data/images/val"            # Dossier des images de validation.
  test_images_dir: "data/images/test" 
  train_annotations_file: "data/annotations/instances_train_objects_in_water.json"
  val_annotations_file: "data/annotations/instances_val_objects_in_water.json"
  test_annotations_file: "data/annotations/instances_test_objects_in_water.json"

  yolo_dataset_dir: "data/yolo"                 # Dossier pour les annotations YOLO.
  trained_model_dir: "models/"                   # Dossier pour les modèles entraînés.
  export_model_dir: "outputs/exports/"           # Dossier pour les modèles exportés.
  output_videos_dir: "outputs/videos/"           # Dossier pour les vidéos de suivi.
  log_file: "log.txt"                            # Fichier log à la racine.

# Configuration YOLO
yolo:
  pretrained_model: "yolov8n.pt"                 # Modèle YOLOv8 de base.
  epochs: 20
  batch_size: 16
  img_size: 640

# Configuration du suivi (tracking)
tracking:
  input_video: "assets/input_video.mp4"          # Chemin de la vidéo d'entrée.
  output_video: "outputs/videos/tracked_video.mp4" # Chemin de la vidéo de sortie.

# Configuration de la visualisation
visualization:
  output_dir: "outputs/visualizations/"          # Dossier pour les visualisations.

# Configuration de l'évaluation
evaluation:
  val_images_folder: "data/images/val"
  val_labels_folder: "data/yolo_labels/val"
  best_model_path: "outputs/exports/yolov8_best.pt"
  metrics_output_file: "outputs/evaluation/metrics.json"
  confidence_threshold: 0.5
  iou_threshold: 0.5                            # Seuil IoU pour la suppression non maximale (NMS).